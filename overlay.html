<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mineplix Achievement Cards Decor</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', monospace;
            user-select: none;
            -webkit-user-select: none;
            width: 100%;
        }

        .mc-toast-mini {
            background-color: rgba(33, 33, 33, 1);
            border: 2px solid #000000;
            image-rendering: pixelated;
            padding: 10px 14px;
        }

        .mc-title {
            color: #FFFF55;
            text-shadow: 1px 1px 0px #3F3F00;
            font-size: 16px;
            line-height: 1.5;
            display: block;
            width: 100%;
            text-align: left;
        }

        .mc-subtext {
            color: #FFFFFF;
            text-shadow: 1px 1px 0px #3F3F3F;
            font-size: 11px;
            line-height: 1.5;
            display: block;
            width: 100%;
            text-align: left;
            margin-top: 4px;
        }
    </style>
</head>

<body class="p-3 flex justify-center">

    <div class="flex flex-col w-full max-w-[280px]">

        <div class="mc-toast-mini flex flex-col justify-center">
            <span class="mc-title">
                Ayo bermain bersama :
            </span>
            <span class="mc-subtext">
                Java: go.mineplix.biz.id
            </span>
            <span class="mc-subtext">
                Bedrock: go.mineplix.biz.id:25565
            </span>
        </div>

    </div>

</body>
</html>
