<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mineplix Achievement Cards Decor</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            font-family: 'Press Start 2P', monospace;
            user-select: none;
            -webkit-user-select: none;
            width: 100%;
        }

        body {
            padding: 12px;
            display: flex;
            justify-content: center;
        }

        .container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 280px;
        }

        .mc-toast-mini {
            background-color: #222;
            border: 2px solid #000000;
            image-rendering: pixelated;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .mc-toast-mini:not(:last-child) {
            margin-bottom: 24px;
        }

        .mc-title {
            color: #FFFF55;
            font-size: 12px;
            line-height: 1.5;
            display: block;
            width: 100%;
            text-align: left;
            text-transform: uppercase;
        }

        .mc-subtext {
            color: #FFFFFF;
            font-size: 8px;
            line-height: 1.5;
            display: block;
            width: 100%;
            text-align: left;
            margin-top: 4px;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="mc-toast-mini">
            <span class="mc-title">
                Java Edition
            </span>
            <span class="mc-subtext">
                go.mineplix.biz.id
            </span>
        </div>

        <div class="mc-toast-mini">
            <span class="mc-title">
                Bedrock Edition
            </span>
            <span class="mc-subtext">
                go.mineplix.biz.id:25565
            </span>
        </div>

    </div>

</body>
</html>
